name: Pro-Booking France Prospect Scan

'on':
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of domains to scan (maximum 100)'
        type: number
        required: true
        default: 100
      delay:
        description: 'Delay between requests in seconds'
        type: string
        required: true
        default: '2.5'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scanner dependencies
        run: python -m pip install -r tools/probooking-prospect-scanner/requirements.txt
      - name: Run prospect scan
        working-directory: tools/probooking-prospect-scanner
        env:
          SCAN_LIMIT: ${{ inputs.limit }}
          SCAN_DELAY: ${{ inputs.delay }}
        run: python scanner.py --input pilot_domains.csv --limit "$SCAN_LIMIT" --delay "$SCAN_DELAY"
      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: probooking-france-prospect-scan
          path: |
            tools/probooking-prospect-scanner/scanner_results.csv
            tools/probooking-prospect-scanner/scanner_evidence.jsonl
          if-no-files-found: error
          retention-days: 30
