name: Pro-Booking France Prospect Scan - No Camping

'on':
  workflow_dispatch:
    inputs:
      delay:
        description: 'Minimum delay between website requests in seconds'
        type: string
        required: true
        default: '2.5'

permissions:
  contents: write
  actions: write

concurrency:
  group: probooking-france-prospect-scan-no-camping
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scanner dependencies
        run: python -m pip install -r tools/probooking-prospect-scanner/requirements.txt
      - name: Scan next batch of 100 non-camping domains
        id: batch
        working-directory: tools/probooking-prospect-scanner
        env:
          SCAN_DELAY: ${{ inputs.delay || '2.5' }}
        run: python run_batch_no_camping.py
      - name: Build separate merged and deduplicated master file
        working-directory: tools/probooking-prospect-scanner
        run: python merge_results.py
      - name: Save progress, results and merged master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probooking-prospect-scanner/scan_state_no_camping.json tools/probooking-prospect-scanner/all_scanner_results_no_camping.csv tools/probooking-prospect-scanner/all_scanner_evidence_no_camping.jsonl tools/probooking-prospect-scanner/all_scanner_results_merged.csv
          git commit -m "Save non-camping prospect scan batch and merged results" || echo "No result changes to commit"
          git push
      - name: Automatically start the next batch
        if: steps.batch.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          SCAN_DELAY: ${{ inputs.delay || '2.5' }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/probooking-france-prospect-scan-no-camping.yml/dispatches \
            -d "{\"ref\":\"$REF_NAME\",\"inputs\":{\"delay\":\"$SCAN_DELAY\"}}"
      - name: Upload batch backup
        uses: actions/upload-artifact@v5
        with:
          name: probooking-no-camping-batch-${{ github.run_number }}
          path: |
            tools/probooking-prospect-scanner/_batch_results_no_camping.csv
            tools/probooking-prospect-scanner/_batch_evidence_no_camping.jsonl
          if-no-files-found: ignore
          retention-days: 30
